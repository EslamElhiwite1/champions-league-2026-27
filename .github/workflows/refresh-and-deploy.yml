name: Refresh Knockout Snapshot and Deploy Pages

on:
  schedule:
    # Runs hourly at an off-hour minute (UTC) to respect free-tier provider limits
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      strict_refresh:
        description: 'Fail workflow if snapshot refresh fails'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-snapshot-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import reviewed club logos and match broadcaster source
        run: |
          if [ ! -f src/config/clubLogos.ts ]; then
            echo  | base64 --decode > /tmp/editorial-assets.zip
            unzip -o /tmp/editorial-assets.zip
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run unit tests
        run: |
          npm run lint
          npm test

      - name: Refresh competition snapshot (if token secret is configured)
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.strict_refresh }}" = "true" ]; then
            npx tsx scripts/refresh-data.ts --strict
          else
            npx tsx scripts/refresh-data.ts
          fi

      - name: Persist last good snapshot and exported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts public package.json package-lock.json index.html vite.config.ts vitest.config.ts tsconfig.json README.md metadata.json .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Update verified CL snapshot and AI Studio source"
            git pull --rebase origin main
            git push
          fi

      - name: Build static site for GitHub Pages base path
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Allow artifact metadata to settle
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
